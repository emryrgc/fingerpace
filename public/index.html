<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <!--seo-->
  <meta name="theme-color" content="#0a0b0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="kerb" aria-hidden="true"></div>
  <header class="topbar">
    <a href="/" class="brand" aria-label="FingerGP ana sayfa">
      <img class="brand-logo" src="/img/logo-160.png" alt="" width="160" height="73">
      <span class="brand-name" lang="en">Finger<b>GP</b></span>
    </a>
    <nav class="nav" aria-label="Ana menü">
      <a href="/canli-yaris" data-nav="race" class="nav-live">Canlı Yarış</a>
      <a href="/klavye-hiz-testi" data-nav="typing">Klavye GP</a>
      <a href="/refleks-testi" data-nav="reflex">Start Işıkları</a>
      <a href="/cpm-testi" data-nav="clicks">Pit Stop</a>
      <a href="/siralama" data-nav="leaderboard">Sıralama</a>
    </nav>
    <button class="pilot-chip" id="pilot-chip" type="button">Pilot ol</button>
  </header>

  <main id="view" tabindex="-1"><!--prerender--></main>

  <footer class="footer">
    <span>FingerGP · parmakların pistte</span>
    <span class="muted">Sıralamalar her gün 00:00 UTC'de yeni tura başlar.</span>
  </footer>

  <dialog id="pilot-dialog" class="dialog">
    <form method="dialog" id="pilot-form">
      <h2>Pilot lisansı</h2>
      <p class="muted">Sıralamaya girmek için bir pilot adı seç. Şifre yok — lisansın bu tarayıcıda saklanır.</p>
      <label for="pilot-name">Pilot adı</label>
      <input id="pilot-name" name="name" autocomplete="nickname" minlength="3" maxlength="16" required
             placeholder="ör. ŞimşekParmak">
      <p class="form-error" id="pilot-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" value="cancel" id="pilot-cancel">Vazgeç</button>
        <button type="submit" class="btn primary">Lisansı al</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
